
name: Testes automatizados - Santo Onofre

on:
  workflow_dispatch:
  push:
    branches: [main, melhoria-qualidade-codigo]
  pull_request:
    branches: [main]

jobs:
  testes:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Executar testes e cobertura
        run: |
          python -m pytest -v --cov=app --cov=database --cov-report=term
