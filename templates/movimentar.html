
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Registrar movimentação - Santo Onofre</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="container">
        <h1>Santo Onofre</h1>
        <h2>Registrar movimentação</h2>

        <p><strong>Conta:</strong> {{ conta["descricao"] }}</p>

        <p>
            <strong>Saldo pendente:</strong>
            {{ saldo | moeda }}
        </p>

        {% if erro %}
            <p class="mensagem-erro" role="alert">
                {{ erro }}
            </p>
        {% endif %}

        {% if saldo > 0 %}
        <form method="POST">
            <label for="valor">Valor da movimentação (R$)</label>
            <input type="number" id="valor" name="valor"
                   min="0.01" step="0.01" required>

            <label for="data_movimentacao">
                Data do pagamento ou recebimento
            </label>
            <input type="date" id="data_movimentacao"
                   name="data_movimentacao" required>

            <button type="submit">
                Registrar movimentação
            </button>
        </form>
        {% else %}
            <p>Esta conta já está quitada.</p>
        {% endif %}

        <p>
            <a href="{{ url_for('consultar') }}">
                Voltar para consulta
            </a>
        </p>
    </main>
</body>
</html>
