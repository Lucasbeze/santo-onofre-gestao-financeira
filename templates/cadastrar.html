
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Conta - Santo Onofre</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <script defer
            src="{{ url_for('static', filename='acessibilidade.js') }}">
    </script>
</head>

<body>
    <!-- Botão de acessibilidade -->
    <button
        type="button"
        class="botao-acessibilidade"
        id="alternar-contraste"
        aria-pressed="false"
        aria-label="Ativar modo de alto contraste">
        Alto contraste
    </button>

    <main class="container">
        <h1>Santo Onofre</h1>
        <h2>Cadastrar conta financeira</h2>

        {% if erro %}
            <p class="mensagem-erro" role="alert">{{ erro }}</p>
        {% endif %}

        <form method="POST" action="{{ url_for('cadastrar') }}">
            <label for="descricao">Descrição</label>
            <input type="text" id="descricao" name="descricao"
                   required maxlength="200">

            <label for="tipo">Tipo de conta</label>
            <select id="tipo" name="tipo" required>
                <option value="">Selecione</option>
                <option value="PAGAR">Conta a pagar</option>
                <option value="RECEBER">Conta a receber</option>
            </select>

            <label for="valor">Valor (R$)</label>
            <input type="number" id="valor" name="valor"
                   min="0.01" step="0.01" required>

            <label for="vencimento">Data de vencimento</label>
            <input type="date" id="vencimento"
                   name="vencimento" required>

            <button type="submit">Salvar conta</button>
        </form>

        <p>
            <a href="{{ url_for('inicio') }}">Voltar ao início</a>
        </p>
    </main>
</body>
</html>
