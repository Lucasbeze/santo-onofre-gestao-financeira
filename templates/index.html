
<!DOCTYPE html>

    <title>Santo Onofre - Gestão Financeira</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script defer src="{{ url_for('static', filename='acessibilidade.js') }}"></script>

<body>
    <!-- Botão de acessibilidade -->

        type="button"
        class="botao-acessibilidade"

    <main class="container">

        <a class="botao" href="{{ url_for('cadastrar') }}">

        <a class="botao" href="{{ url_for('consultar') }}">
            Consultar contas
